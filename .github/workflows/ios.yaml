# Runs the suite in plugin/tests on an iOS simulator, through cordova-paramedic: it
# builds a throwaway Cordova app around the plugin, deploys it, collects the Jasmine
# results and exits non-zero on any failure.
name: iOS Testsuite

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'demo/**'
      - 'docs/**'
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'demo/**'
      - 'docs/**'

permissions:
  contents: read

# macOS runners are the expensive part; don't leave superseded runs going.
concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: iOS ${{ matrix.ios }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            ios: 18.x
            xcode: 16
          - os: macos-26
            ios: 26.x
            xcode: 26

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # The runner image carries every Xcode it supports side by side, so no action is needed
      # to pick one: the newest of the major this job tests.
      - name: Select Xcode ${{ matrix.xcode }}
        run: |
          app=$(find /Applications -maxdepth 1 -name 'Xcode_${{ matrix.xcode }}.*.app' | sort -V | tail -1)
          sudo xcode-select -s "$app/Contents/Developer"
          xcodebuild -version

      # ios-deploy has to be global: "cordova requirements ios" needs it on PATH, and the
      # npm package declares os: ["darwin"], so as a devDependency it would fail npm ci on
      # the Linux runner the Android suite uses.
      - run: npm i -g ios-deploy@1.12.2

      # cordova and cordova-paramedic are pinned devDependencies, so the toolchain is the
      # same here as it is locally and the lockfile is the only place a version lives.
      #
      # paramedic comes from npm as cordova-paramedic-hotfix: apache/cordova-paramedic master,
      # which has the two fixes this plugin needs, and which apache has not released (its
      # latest on npm is 0.5.0):
      #  - apache/cordova-paramedic#314 -- --plugin appended its --variable args to the
      #    plugin path instead of passing them as separate argv entries, so the CLI read the
      #    whole string as one plugin spec. This plugin's APP_ID, APP_NAME and CLIENT_TOKEN
      #    are mandatory, so installation could not succeed at all.
      #  - apache/cordova-paramedic#315 -- simulator lookup compared the minor version
      #    cordova reports (18.3) with the patch version xctrace reports (18.3.1) for
      #    equality, finding nothing whenever the runtime carries a patch component.
      # It is installed under the name cordova-paramedic, so the scripts are unchanged. The
      # pin can go back to apache/cordova-paramedic once it publishes a release with both.
      - run: npm ci

      # The plugin variables live in the npm script, so the same command runs locally.
      # No --target is passed: any iPhone runs this suite identically, and pinning a device
      # name only breaks when GitHub rotates what its images ship.
      - run: npm run test:ios
