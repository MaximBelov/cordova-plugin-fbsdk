# Runs the suite in plugin/tests on an Android emulator, through cordova-paramedic: it
# builds a throwaway Cordova app around the plugin, deploys it, collects the Jasmine
# results and exits non-zero on any failure.
name: Android Testsuite

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'demo/**'
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'demo/**'

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Android ${{ matrix.android }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - android: 14
            api-level: 34
          - android: 16
            api-level: 36

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # cordova-android 15 builds with AGP 8.10, which needs JDK 17 and not 21.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Without this the emulator falls back to software rendering and times out.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # cordova and cordova-paramedic are pinned devDependencies. paramedic is pinned to a
      # fork rather than apache/cordova-paramedic; see ios.yaml for the two fixes and for why
      # the pin cannot be dropped until both apache/cordova-paramedic#314 and
      # apache/cordova-paramedic#315 have landed.
      - run: npm ci

      # Create the AVD first so the run below starts against a warm one, as the emulator
      # action's own docs recommend.
      - name: Pregenerate the AVD
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: echo "AVD created"

      - name: Run plugin test suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: npm run test:android
